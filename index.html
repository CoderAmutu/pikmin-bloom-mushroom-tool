<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>皮克敏蘑菇重生推算器</title>
    <link rel="icon" href="./favicon.ico?v=1" sizes="any" />
    <link rel="shortcut icon" href="./favicon.ico?v=1" />
    <link rel="apple-touch-icon" href="./favicon.ico?v=1" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#8fd14f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="蘑菇推算器" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-image"></div>

    <div class="page">
      <div class="topbar">
        <div class="title-block">
          <h1>皮克敏蘑菇重生推算器</h1>
        </div>

        <div class="status-cards">
          <div class="time-card">
            <div class="time-card-label">目前台北時間</div>
            <div class="time-card-value" id="taipei-now">—</div>
          </div>

          <div class="next-card">
            <div class="time-card-label">即將冒出來的蘑菇</div>
            <div class="next-card-line" id="next-mushroom-name">地點：—</div>
            <div class="next-card-line" id="next-mushroom-time">
              重生時間：—（—）
            </div>
            <div class="next-card-line next-card-open-hint" id="next-mushroom-open-hint">
              建議開遊戲：—
            </div>
            <div class="next-card-line next-card-open-now-delay" id="next-mushroom-open-now-delay">
              現在開啟：—
            </div>
          </div>
        </div>
      </div>

      <div class="panel profile-panel">
        <div class="panel-header panel-header-compact">
          <div>
            <h2>場所設定檔</h2>
            <p>儲存常用地點組合，一鍵切換不同場所。</p>
          </div>
          <button class="btn-outline" id="save-profile-btn">新增場所設定檔</button>
        </div>
        <div class="profile-list" id="profile-list">
          <div class="empty-tags" id="empty-profiles">目前還沒有設定檔</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div>
            <h2>蘑菇清單</h2>
            <p>先輸入地點與剩餘時間，系統會從您輸入當下那一秒開始倒數。</p>
          </div>

          <div class="header-actions">
            <div
              class="alert-setting alert-toggle-setting"
              id="lead-alert-setting"
            >
              <label class="alert-toggle" for="lead-alert-enabled">
                <input type="checkbox" id="lead-alert-enabled" />
                <span>提前提醒</span>
              </label>
              <div class="alert-setting-control">
                <input
                  type="number"
                  id="lead-seconds-input"
                  min="1"
                  max="300"
                  step="1"
                  inputmode="numeric"
                />
                <span>秒前</span>
              </div>
            </div>

            <div
              class="alert-setting alert-toggle-setting"
              id="frequent-reminder-setting"
            >
              <label class="alert-toggle" for="frequent-reminder-enabled">
                <input type="checkbox" id="frequent-reminder-enabled" />
                <span>頻繁提醒（每 5 秒）</span>
              </label>
            </div>

            <div
              class="alert-setting alert-toggle-setting"
              id="system-notification-setting"
            >
              <label class="alert-toggle" for="system-notification-enabled">
                <input type="checkbox" id="system-notification-enabled" />
                <span>系統通知</span>
              </label>
            </div>

            <div class="alert-setting sound-setting">
              <div class="alert-setting-label">音效音量</div>
              <div class="alert-setting-control sound-setting-control">
                <input
                  type="range"
                  id="alert-volume-input"
                  min="0"
                  max="100"
                  step="1"
                />
                <span id="alert-volume-text">130%</span>
              </div>
            </div>

            <div class="alert-setting optimal-open-setting" id="optimal-open-setting">
              <div class="alert-setting-label">最佳開遊戲校正</div>

              <div class="alert-setting-control optimal-open-bias-control">
                <div class="bias-mode-tabs">
                  <button type="button" class="btn-outline bias-mode-btn" data-mode="conservative" title="預設。偏晚一點開，比較不怕手滑錯過">保守</button>
                  <button type="button" class="btn-outline bias-mode-btn" data-mode="custom" title="自己輸入緩衝秒數">自訂</button>
                </div>
                <span class="custom-bias-wrapper" id="custom-bias-wrapper">
                  <input
                    type="number"
                    id="custom-bias-seconds-input"
                    min="0"
                    max="30"
                    step="0.01"
                    inputmode="decimal"
                  />
                  <span>秒緩衝</span>
                </span>
              </div>

              <div class="alert-setting-control optimal-open-control">
                <button
                  type="button"
                  class="btn-outline measure-load-btn"
                  id="measure-load-btn"
                  title="按一下開始計時、看到畫面再按一下，自動填入秒數"
                >
                  ⏱ 計時
                </button>
                <input
                  type="number"
                  id="game-load-seconds-input"
                  min="0"
                  max="60"
                  step="0.01"
                  inputmode="decimal"
                />
                <span>秒看到畫面</span>
                <input
                  type="number"
                  id="refresh-period-seconds-input"
                  min="1"
                  max="60"
                  step="0.01"
                  inputmode="decimal"
                />
                <span>秒刷新一次</span>
              </div>
            </div>

            <button class="btn-outline" id="sort-btn">依重生時間排序</button>
          </div>
        </div>

        <div class="row-search" id="row-search">
          <span class="row-search-icon" aria-hidden="true">🔍</span>
          <input
            type="text"
            id="row-search-input"
            class="row-search-input"
            placeholder="搜尋地點名稱…"
            autocomplete="off"
            aria-label="搜尋地點名稱"
          />
          <button
            type="button"
            class="row-search-clear is-hidden"
            id="row-search-clear"
            aria-label="清除搜尋"
          >
            ×
          </button>
          <span class="row-search-count" id="row-search-count"></span>
        </div>

        <div class="row-list" id="row-list"></div>

        <div class="row-search-empty is-hidden" id="row-search-empty">
          找不到符合的地點
        </div>
      </div>

      <div class="bottom-actions">
        <button class="btn-outline bottom-sort-btn" id="bottom-sort-btn">依重生時間排序</button>
        <button class="btn-primary" id="add-row-btn">＋ 新增一筆</button>
        <button class="btn-outline" id="copy-all-btn">全部複製</button>
        <button class="btn-outline btn-danger-soft" id="clear-all-btn">
          清空清單
        </button>
        <button class="btn-outline" id="test-mode-btn">測試模式：關</button>
      </div>

      <div class="footer-time" id="footer-time">現在時間：—（台北時間）</div>
      <div class="sync-status is-pending" id="sync-status">⏳ 對時中…</div>
    </div>

    <div class="floating-stack">
      <div class="floating-calibration-card is-hidden" id="floating-calibration-card">
        <div class="floating-calibration-title" id="floating-calibration-title">
          ⚠ 該重新確認
        </div>
        <div class="floating-calibration-list" id="floating-calibration-list"></div>
      </div>

      <div class="floating-next-card" id="floating-next-card">
        <div class="floating-next-title">即將冒出來的蘑菇</div>
        <div class="floating-next-name" id="floating-next-name">地點：—</div>
        <div class="floating-next-time" id="floating-next-time">重生：—（—）</div>
        <div class="floating-next-open-hint" id="floating-next-open-hint">建議開遊戲：—</div>
        <div class="floating-next-open-now-delay" id="floating-next-open-now-delay">現在開啟：—</div>
      </div>

      <div class="floating-search" id="floating-search">
        <div class="floating-search-panel" id="floating-search-panel">
          <div class="floating-search-field">
            <span class="floating-search-icon" aria-hidden="true">🔍</span>
            <input
              type="text"
              id="floating-search-input"
              class="floating-search-input"
              placeholder="搜尋地點名稱…"
              autocomplete="off"
              aria-label="搜尋地點名稱"
            />
            <button
              type="button"
              class="floating-search-clear is-hidden"
              id="floating-search-clear"
              aria-label="清除搜尋"
            >
              ×
            </button>
          </div>
          <div class="floating-search-count" id="floating-search-count">
            Enter 可跳到第一筆符合的地點
          </div>
        </div>
      </div>
    </div>

    <div class="kind-modal is-hidden" id="kind-modal">
      <div class="kind-modal-backdrop" id="kind-modal-backdrop"></div>
      <div
        class="kind-modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="kind-modal-title"
      >
        <div class="kind-modal-header">
          <div class="kind-modal-heading">
            <h3 id="kind-modal-title">蘑菇大小／種類</h3>
            <p class="kind-modal-sub" id="kind-modal-sub">地點：—</p>
          </div>
          <button
            class="kind-modal-close"
            id="kind-modal-close"
            type="button"
            aria-label="關閉"
          >
            ×
          </button>
        </div>

        <div class="kind-group">
          <div class="kind-group-label">大小</div>
          <div class="kind-chip-list" id="kind-size-list"></div>
        </div>

        <div class="kind-group">
          <div class="kind-group-label">種類</div>
          <div class="kind-type-wrap">
            <div class="kind-chip-list" id="kind-type-list"></div>
            <p class="kind-type-hint is-hidden" id="kind-type-hint"></p>
          </div>
        </div>

        <div class="kind-modal-preview" id="kind-modal-preview">
          未選擇大小／種類
        </div>

        <div class="kind-modal-actions">
          <button
            class="btn-outline btn-danger-soft"
            id="kind-clear-btn"
            type="button"
          >
            清除
          </button>
          <button class="btn-primary" id="kind-done-btn" type="button">
            完成
          </button>
        </div>
      </div>
    </div>

    <div
      class="toast-stack"
      id="toast-stack"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
